# Declarative Automation Bundle for the Bakehouse medallion project.
# See https://docs.databricks.com/dev-tools/bundles/index.html
bundle:
  name: databricks_claude_code
  uuid: 199d1d5b-7132-4b09-9ab1-221d3822583c

include:
  - resources/*.yml

# The catalog is the ONLY thing that differs between dev and prod.
# It is never written literally in a pipeline, a SQL file or the dashboard —
# everything resolves it from ${var.catalog}.
variables:
  catalog:
    description: Catalog holding the bronze/silver/gold schemas. Set per target.
  warehouse_id:
    description: SQL warehouse used by the AI/BI dashboard.

targets:
  dev:
    default: true
    workspace:
      host: https://dbc-63b6ef3a-74e9.cloud.databricks.com
    variables:
      catalog: bakehouse_claude
      warehouse_id: dc7b8d0d81c6d177
    # 'mode: development' is deliberately NOT used: it renames every resource,
    # including the schemas, to dev_<user>_<name>. The layer names are the
    # contract shared with the pipeline configuration and must stay literal
    # (bronze/silver/gold) — dev and prod are separated by the catalog alone.
    # The two development behaviours worth keeping are set explicitly here.
    presets:
      pipelines_development: true
      trigger_pause_status: PAUSED

  prod:
    mode: production
    workspace:
      host: https://dbc-63b6ef3a-74e9.cloud.databricks.com
      root_path: /Workspace/Users/araujorod@outlook.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      # NOTE: this catalog must exist before the first prod deploy.
      catalog: bakehouse_prod
      warehouse_id: dc7b8d0d81c6d177
    permissions:
      - user_name: araujorod@outlook.com
        level: CAN_MANAGE
